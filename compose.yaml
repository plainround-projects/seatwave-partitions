# SeatWave's sharded lab for Module 18: three PostgreSQL databases under the Compose project name
# seatwave-partitions. "directory" holds the ring and the worker-id leases; "shard-host-1" and
# "shard-host-2" are two machines that serve SeatWave's 64 logical shards, 32 each, one schema per
# shard. Start and stop them with scripts/stack.sh, which brings everything down with "down -v".
# The image is the Docker Official Image postgres:18.6 (Debian trixie), pinned by tag and digest
# (the same pin as Modules 13 and 14), checked on Docker Hub on 12 November 2026: index digest
# unchanged since 6 November 2026, with an arm64 variant. Three ports, on 127.0.0.1 only, from
# Module 18's range 21800 to 21899. Nothing runs privileged, nothing uses the host network or the
# Docker socket, and the only folder mounted is this project's own db/init, read-only.
name: seatwave-partitions

x-postgres: &postgres
  image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
  environment:
    POSTGRES_USER: postgres
    POSTGRES_DB: seatwave
    # Every password is a file generated at run time into .secrets (scripts/stack.sh up) and
    # removed by scripts/stack.sh down, together with the databases that used it.
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  secrets:
    - postgres_password
    - owner_password
    - app_password
    - replicator_password
  security_opt:
    - no-new-privileges:true
  read_only: true
  # The entrypoint starts as root to own the data folder, then runs PostgreSQL as its own user.
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
  shm_size: 256m
  tmpfs:
    - /var/run/postgresql
    - /tmp
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "postgres", "-d", "seatwave"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  directory:
    <<: *postgres
    # The directory is small and read at start-up and on every reload: one CPU, 512 MB.
    cpus: 1
    mem_limit: 512m
    volumes:
      - directory-data:/var/lib/postgresql
      # Runs once, when the data volume is new: the login roles and their rights.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:21800:5432"

  shard-host-1:
    <<: *postgres
    # wal_level=logical lets this machine publish a shard's tables to another machine (the shard
    # move); max_connections 200 leaves room for the stack tests' pools and the copy's workers.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_connections=200"]
    # Four CPUs like Module 1's reference machine; 1.5 GB of memory, not its 16 GB, because the
    # Docker virtual machine (8 GB) is shared with other projects.
    cpus: 4
    mem_limit: 1536m
    volumes:
      - shard-host-1-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:21801:5432"

  shard-host-2:
    <<: *postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_connections=200"]
    cpus: 4
    mem_limit: 1536m
    volumes:
      - shard-host-2-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:21802:5432"

secrets:
  postgres_password:
    file: ./.secrets/postgres.password
  owner_password:
    file: ./.secrets/owner.password
  app_password:
    file: ./.secrets/app.password
  replicator_password:
    file: ./.secrets/replicator.password

volumes:
  directory-data:
  shard-host-1-data:
  shard-host-2-data:
