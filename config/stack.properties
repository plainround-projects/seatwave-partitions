# The lab databases of compose.yaml, for the stack tests and the shard move. Every key is required.
directory.url=jdbc:postgresql://127.0.0.1:21800/seatwave
# Each name is a ring_shards.host_name and the Compose service name of that machine.
hosts=shard-host-1,shard-host-2
host.shard-host-1.url=jdbc:postgresql://127.0.0.1:21801/seatwave
host.shard-host-2.url=jdbc:postgresql://127.0.0.1:21802/seatwave
db.superUser=postgres
db.superPasswordFile=.secrets/postgres.password
db.ownerUser=seatwave_owner
db.ownerPasswordFile=.secrets/owner.password
db.appUser=seatwave_app
db.appPasswordFile=.secrets/app.password
db.replicatorUser=seatwave_replicator
db.replicatorPasswordFile=.secrets/replicator.password
# 24 connections per machine: the hold-limit race keeps 50 holds in flight over 16 shards' worth
# of machines; a test opens at most two routers, so 48 per machine, under max_connections 200.
db.poolSize=24
db.connectTimeoutMillis=10000
# A write for a paused shard waits this long for the switch to finish before it is refused.
router.pauseWaitMillis=5000
# Module 1's hold: 300 seconds.
hold.durationSeconds=300
lease.durationSeconds=30
move.copyTimeoutSeconds=1800
move.lagTimeoutMillis=30000
# The measured move (./gradlew shardMove): 2,500 sections of 1,000 seats on shard-17, with a hold
# and a booking for 900 seats of each, 2,250,000 of each; see the README for the scale.
seed.sections=2500
writer.holdsPerSecond=200
writer.customers=10000
